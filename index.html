<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>George King</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat">
      <header class="chat-header">
        <h1>George King</h1>
        <p>his majesty is listening</p>
      </header>

      <ul class="messages" id="messages">
        <li class="msg bot">
          Greetings. I am George. Say something below and it will appear here.
        </li>
      </ul>

      <form class="chat-form" id="chat-form">
        <input
          type="text"
          id="message-input"
          placeholder="Address the king…"
          autocomplete="off"
          aria-label="Message"
        />
        <button type="submit">Send</button>
      </form>
    </div>

    <script src="chat.js"></script>
  </body>
</html>
